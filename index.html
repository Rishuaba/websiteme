<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharukh — Writing</title>
  <meta name="description" content="exploring web3.curious about ai/si.love reading wiki.">
  <meta name="theme-color" content="#050507">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script>
    /* enables animations; shows the arrival veil after an in-site link click */
    (function(d){var c=d.documentElement;c.classList.add('js');
      try{if(sessionStorage.getItem('veil')){c.classList.add('arriving');sessionStorage.removeItem('veil');}}catch(e){}
      setTimeout(function(){if(!window.__site){c.classList.remove('js','arriving');}},2500);})(document);
  </script>
</head>
<body>
  <!-- Animated background (aurora glow + grain). No need to edit. -->
  <div class="bg" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
    <span class="grain"></span>
  </div>
  <!-- Page transition overlay used when a link is clicked -->
  <div class="veil" aria-hidden="true"></div>

  <main class="wrap">

    <!-- =========================================================
         ABOUT ME — EDIT THIS SECTION
         Change the name, the small label, and the paragraph below.
         ========================================================= -->
    <section class="about">
      <p class="eyebrow reveal">Hello, I'm</p>
      <h1 class="name reveal">Sharukh</h1>
      <p class="intro reveal">exploring web3.curious about ai/si.love reading wiki.</p>
    </section>
    <!-- ===================== END ABOUT ME ===================== -->

    <section class="latest" aria-labelledby="latest-title">
      <h2 id="latest-title" class="section-title reveal">Latest Blog</h2>

      <!-- Posts are loaded from posts.json by main.js.
           The list below is a fallback shown if JavaScript is off. -->
      <ol class="posts" id="posts">
        <li class="post reveal">
          <a class="post-link" href="posts/what-you-repeatedly-watch-shapes-your-brain.html">
            <time class="post-date" datetime="2026-11-06">Nov 6, 2026</time>
            <h3 class="post-title">What you repeatedly watch shapes your brain.</h3>
            <p class="post-excerpt">What you repeatedly listen to, think, and spend time with shapes your brain. Repetition rewires. You become what you behold.</p>
            <span class="post-arrow" aria-hidden="true">→</span>
          </a>
        </li>
      </ol>
    </section>

  </main>

  <script src="main.js"></script>
</body>
</html>

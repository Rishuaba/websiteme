<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Advice For The Younger Generation · Sharukh</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<script>
  (function(){try{var t=localStorage.getItem('theme');if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}})();
</script>
<style>
:root{
  --accent:#b8603e;
  --wash-1:#fdf1e6;
  --wash-2:#f8d9c0;
  --wash-3:#e9a585;
  --bg:#fcf5ee;
  --text:#2b2420;
  --muted:#7a6a60;
  --faint:#a8968a;
  --line:rgba(80,50,30,.14);
  --header:rgba(252,243,234,.72);
  --menu-bg:#fcf1e6;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --col:700px;
}
[data-theme="dark"]{
  --accent:#e59a75;
  --wash-1:#17110e;
  --wash-2:#2a1a12;
  --wash-3:#4a2a1c;
  --bg:#15100d;
  --text:#f1e6dc;
  --muted:#b29e90;
  --faint:#7e6c60;
  --line:rgba(255,220,195,.11);
  --header:rgba(22,16,13,.7);
  --menu-bg:#18110d;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70% 90% at 100% 35%,var(--wash-3) 0%,transparent 60%),
    radial-gradient(60% 70% at 0% 100%,var(--wash-1) 0%,transparent 70%),
    linear-gradient(115deg,var(--wash-1) 0%,var(--wash-2) 55%,var(--wash-3) 120%);
  opacity:.9;transition:opacity .4s}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:4px;border-radius:2px}
.wrap{max-width:var(--col);margin:0 auto;padding:0 28px}
header{position:sticky;top:0;z-index:20;transition:background-color .35s,border-color .35s,backdrop-filter .35s;border-bottom:1px solid transparent}
header.scrolled{background:var(--header);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom-color:var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:.22em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.nav-right{display:flex;align-items:center;gap:28px}
#menu{display:flex;gap:28px}
#menu a{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);position:relative;padding:4px 0;transition:color .25s}
#menu a::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
#menu a:hover{color:var(--text)}
#menu a:hover::after{transform:scaleX(1)}
.icon-btn{background:none;border:0;padding:6px;margin:-6px;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .2s}
.icon-btn:hover{color:var(--text)}
.icon-btn svg{width:16px;height:16px}
[data-theme="dark"] .sun,[data-theme="light"] .moon{display:none}
#menuBtn{display:none}
article{padding:72px 0 96px}
h1{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;font-size:clamp(40px,6vw,64px);line-height:1.05;margin:0}
time{display:block;margin-top:16px;font-size:12.5px;letter-spacing:.04em;color:var(--faint)}
.back{display:inline-block;margin:0 0 28px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);transition:color .2s,border-color .2s}
.back:hover{color:var(--accent);border-color:var(--accent)}
.body{margin-top:32px}
.body p{margin:0 0 18px;font-size:17px;line-height:1.75}
.rise{opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.2,.65,.25,1),transform 1s cubic-bezier(.2,.65,.25,1);transition-delay:var(--d,0ms)}
.rise.in{opacity:1;transform:none}
@media (max-width:760px){
  .bar{padding:0 22px;height:64px}
  #menuBtn{display:grid}
  #menu{position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;padding:8px 22px 18px;background:var(--menu-bg);box-shadow:0 18px 30px -20px rgba(60,30,10,.35);border-bottom:1px solid var(--line);
    opacity:0;transform:translateY(-8px);pointer-events:none;visibility:hidden;transition:opacity .3s,transform .3s,visibility .3s}
  #menu.open{opacity:1;transform:none;pointer-events:auto;visibility:visible}
  #menu a{padding:14px 0;font-size:12px;border-bottom:1px solid var(--line)}
  #menu a:last-child{border-bottom:0}
  #menu a::after{display:none}
  header.menu-open{background:var(--menu-bg);backdrop-filter:none;-webkit-backdrop-filter:none}
}
@media (max-width:640px){
  .wrap{padding:0 22px}
  article{padding:56px 0 72px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rise{opacity:1;transform:none;transition:none}
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header id="header">
  <div class="bar">
    <a href="../index.html#top" class="brand" aria-label="Sharukh, back to home">Sharukh<span>.</span></a>
    <div class="nav-right">
      <nav id="menu" aria-label="Primary">
        <a href="../index.html#top">About Me</a>
        <a href="../index.html#articles">Blog</a>
      </nav>
      <button class="icon-btn" id="theme" type="button" aria-label="Switch to dark mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg>
      </button>
    </div>
  </div>
</header>
<main>
  <article class="wrap">
    <a class="back rise" href="../index.html#articles">Latest Blog</a>
    <h1 class="rise" style="--d:80ms">Advice For The Younger Generation</h1>
    <time class="rise" style="--d:140ms" datetime="2026-11-06">November 6, 2026</time>
    <!-- EDIT: add more <p> paragraphs here for the rest of the article -->
    <div class="body rise" style="--d:200ms">
      <p>let digest some Real Stoy</p>
    </div>
  </article>
</main>
<script>
(function(){
  var root=document.documentElement;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var themeBtn=document.getElementById('theme');
  function label(){themeBtn.setAttribute('aria-label',root.getAttribute('data-theme')==='dark'?'Switch to light mode':'Switch to dark mode');}
  label();
  themeBtn.addEventListener('click',function(){var n=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',n);save('theme',n);label();});
  var header=document.getElementById('header'),menu=document.getElementById('menu'),menuBtn=document.getElementById('menuBtn');
  function setMenu(open){menu.classList.toggle('open',open);header.classList.toggle('menu-open',open);menuBtn.setAttribute('aria-expanded',String(open));menuBtn.setAttribute('aria-label',open?'Close menu':'Open menu');}
  menuBtn.addEventListener('click',function(){setMenu(!menu.classList.contains('open'));});
  menu.addEventListener('click',function(e){if(e.target.closest('a'))setMenu(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false);});
  var ticking=false;
  function onScroll(){header.classList.toggle('scrolled',scrollY>12);ticking=false;}
  addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(onScroll);}},{passive:true});
  onScroll();
  var nodes=document.querySelectorAll('.rise');
  if(reduce||!('IntersectionObserver' in window)){nodes.forEach(function(el){el.classList.add('in');});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}});},{threshold:.12});
  nodes.forEach(function(el){io.observe(el);});
})();
</script>
</body>
</html>

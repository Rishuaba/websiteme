name: Publish blog

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.issue.title == 'Publish blog'
    runs-on: ubuntu-latest
    steps:
      - name: Reject other people
        if: github.event.issue.user.login != github.repository_owner
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: 'Only the site owner can publish the blog.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: 'closed'
            });

      - name: Checkout
        if: github.event.issue.user.login == github.repository_owner
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Save issue body
        if: github.event.issue.user.login == github.repository_owner
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            fs.writeFileSync('issue-body.txt', context.payload.issue.body || '');

      - name: Write posts.json
        id: write
        if: github.event.issue.user.login == github.repository_owner
        continue-on-error: true
        run: node scripts/publish-blog.mjs issue-body.txt

      - name: Commit and push
        if: github.event.issue.user.login == github.repository_owner && steps.write.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          if git diff --staged --quiet; then
            echo "unchanged"
          else
            git commit -m "Publish blog posts"
            git push
          fi
          rm -f issue-body.txt

      - name: Close issue
        if: github.event.issue.user.login == github.repository_owner && steps.write.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: 'Published. Refresh the website in about a minute. Visitors will see this list.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: 'closed'
            });

      - name: Explain a bad list
        if: github.event.issue.user.login == github.repository_owner && steps.write.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: 'This list could not be published. Add the post again from the website.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: 'closed'
            });
